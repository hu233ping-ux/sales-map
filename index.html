<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>湘鄂销售覆盖版图</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #060c1a;
            color: #c8d8ff;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #name-modal {
            position: fixed;
            inset: 0;
            background: rgba(6,12,26,0.97);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            gap: 24px;
        }

        #name-modal.hidden { display: none; }

        .name-modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #4da6ff;
            letter-spacing: 3px;
        }

        .name-modal-sub {
            font-size: 13px;
            color: #5a6a8a;
            letter-spacing: 1px;
            margin-top: -12px;
        }

        .name-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 320px;
        }

        .name-btn {
            padding: 12px 16px;
            background: rgba(77,166,255,0.08);
            border: 1px solid rgba(77,166,255,0.25);
            border-radius: 8px;
            color: #c8d8ff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .name-btn:hover {
            background: rgba(77,166,255,0.2);
            border-color: #4da6ff;
            color: #fff;
        }

        .visitor-btn {
            width: 320px;
            color: #5a6a8a;
            border-color: rgba(90,106,138,0.25);
            background: rgba(90,106,138,0.05);
            font-size: 13px;
            letter-spacing: 1px;
        }

        .visitor-btn:hover {
            background: rgba(90,106,138,0.15);
            border-color: #5a6a8a;
            color: #c8d8ff;
        }

        #map-overlay {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: none;
            cursor: not-allowed;
        }

        #map-overlay.active { display: block; }

        header {
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(77,166,255,0.12);
            flex-shrink: 0;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            color: #4da6ff;
            letter-spacing: 3px;
        }

        .stats {
            display: flex;
            gap: 36px;
            align-items: center;
        }

        .stat { text-align: center; }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #4da6ff;
            line-height: 1;
            transition: all 0.3s;
        }

        .stat-number.bump {
            color: #80c8ff;
            transform: scale(1.15);
        }

        .stat-label {
            font-size: 11px;
            color: #5a6a8a;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .progress-bar-wrap { width: 160px; }

        .progress-bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #5a6a8a;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .progress-bar-bg {
            height: 6px;
            background: #0f1d3a;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #1a5fff, #4da6ff);
            border-radius: 3px;
            transition: width 0.4s ease;
            box-shadow: 0 0 8px rgba(77,166,255,0.6);
        }

        .sync-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #5a6a8a;
            letter-spacing: 1px;
        }

        .sync-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #5a6a8a;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .sync-dot.connected {
            background: #00c97d;
            box-shadow: 0 0 6px rgba(0,201,125,0.7);
        }

        .user-badge {
            font-size: 12px;
            color: #4da6ff;
            background: rgba(77,166,255,0.1);
            border: 1px solid rgba(77,166,255,0.25);
            border-radius: 12px;
            padding: 3px 12px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .user-badge:hover {
            background: rgba(77,166,255,0.2);
        }

        .main-content {
            flex: 1;
            display: flex;
            min-height: 0;
            overflow: hidden;
        }

        #map-container {
            flex: 1;
            position: relative;
            min-height: 0;
            overflow: hidden;
        }

        #map {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
        }

        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #060c1a;
            gap: 12px;
            z-index: 10;
        }

        .loading-text {
            font-size: 14px;
            color: #4da6ff;
            letter-spacing: 2px;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.2s steps(3, end) infinite;
        }

        @keyframes dots {
            0%   { content: ''; }
            33%  { content: '.'; }
            66%  { content: '..'; }
            100% { content: '...'; }
        }

        .leaderboard-panel {
            width: 210px;
            background: rgba(255,255,255,0.015);
            border-left: 1px solid rgba(77,166,255,0.12);
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .lb-title {
            font-size: 13px;
            font-weight: bold;
            color: #4da6ff;
            letter-spacing: 2px;
            margin-bottom: 14px;
            text-align: center;
        }

        .lb-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 6px;
            border-radius: 6px;
            margin-bottom: 2px;
            transition: background 0.2s;
        }

        .lb-item.me {
            background: rgba(77,166,255,0.1);
            border: 1px solid rgba(77,166,255,0.2);
        }

        .lb-rank {
            font-size: 15px;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }

        .lb-name {
            font-size: 12px;
            color: #c8d8ff;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .lb-item.me .lb-name {
            color: #4da6ff;
            font-weight: bold;
        }

        .lb-count {
            font-size: 14px;
            font-weight: bold;
            color: #4da6ff;
            flex-shrink: 0;
            min-width: 24px;
            text-align: right;
        }

        .lb-item.me .lb-count { color: #80c8ff; }

        .lb-item.rank-up {
            animation: rankUp 0.9s ease forwards;
        }

        @keyframes rankUp {
            0%   { background: rgba(0,201,125,0.35); border-color: rgba(0,201,125,0.6); }
            100% { background: transparent; border-color: transparent; }
        }

        .lb-item.me.rank-up {
            animation: rankUpMe 0.9s ease forwards;
        }

        @keyframes rankUpMe {
            0%   { background: rgba(0,201,125,0.35); border-color: rgba(0,201,125,0.6); }
            100% { background: rgba(77,166,255,0.1); border-color: rgba(77,166,255,0.2); }
        }

        .lb-fab {
            display: none;
            position: fixed;
            bottom: 36px;
            right: 16px;
            background: rgba(26,95,255,0.92);
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 9px 18px;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            z-index: 48;
            box-shadow: 0 2px 12px rgba(26,95,255,0.5);
        }

        @media (max-width: 768px) {
            header {
                padding: 8px 12px;
                gap: 8px;
            }

            .title {
                font-size: 13px;
                letter-spacing: 1px;
            }

            .stats { gap: 12px; }

            .stat-number { font-size: 20px; }

            .stat-label { font-size: 9px; margin-top: 2px; }

            .progress-bar-wrap { width: 90px; }

            .progress-bar-label { font-size: 9px; margin-bottom: 3px; }

            #sync-label { display: none; }

            .user-badge { font-size: 11px; padding: 2px 8px; }

            .leaderboard-panel {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                max-height: 55vh;
                border-left: none;
                border-top: 1px solid rgba(77,166,255,0.2);
                border-radius: 14px 14px 0 0;
                transform: translateY(100%);
                transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
                z-index: 50;
                overflow-y: auto;
            }

            .leaderboard-panel.open {
                transform: translateY(0);
            }

            .lb-fab { display: block; }

            .footer { display: none; }
        }

        .footer {
            padding: 7px;
            text-align: center;
            font-size: 12px;
            color: #2a3a5a;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        #toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(26,111,255,0.9);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            letter-spacing: 1px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 100;
            white-space: nowrap;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #combo-toast {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            background: linear-gradient(135deg, rgba(255,100,50,0.95), rgba(255,50,120,0.95));
            color: #fff;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            z-index: 100;
            white-space: nowrap;
        }

        #combo-toast.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }
    </style>
</head>
<body>

<div id="name-modal">
    <div class="name-modal-title">选择你的身份</div>
    <div class="name-modal-sub">每台设备选择一次，点亮记录绑定到你的名字</div>
    <div class="name-grid" id="name-grid"></div>
    <button class="name-btn visitor-btn" onclick="selectUser('__visitor__')">👁 以参观者身份进入</button>
</div>

<header>
    <div class="title">湘鄂销售覆盖版图</div>
    <div class="stats">
        <div class="stat">
            <div class="stat-number" id="lit-count">0</div>
            <div class="stat-label">已点亮</div>
        </div>
        <div class="stat">
            <div class="stat-number" id="total-count">—</div>
            <div class="stat-label">总县区</div>
        </div>
        <div class="progress-bar-wrap">
            <div class="progress-bar-label">
                <span>覆盖进度</span>
                <span id="percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
            </div>
        </div>
        <div class="sync-status">
            <div class="sync-dot" id="sync-dot"></div>
            <span id="sync-label">连接中</span>
        </div>
        <div class="user-badge" id="user-badge" onclick="switchUser()">—</div>
    </div>
</header>

<div class="main-content">
    <div id="map-container">
        <div id="loading">
            <div class="loading-text loading-dots">地图加载中</div>
        </div>
        <div id="map"></div>
        <div id="map-overlay"></div>
    </div>

    <div class="leaderboard-panel">
        <div class="lb-title" style="display:flex;align-items:center;justify-content:center;gap:10px;">
            <span>⚔ 战队排行</span>
            <span id="lb-close" onclick="toggleLbPanel()" style="display:none;cursor:pointer;font-size:16px;color:#5a6a8a;line-height:1;">✕</span>
        </div>
        <div id="leaderboard"></div>
    </div>
</div>

<div class="footer">点击县区 · 点亮覆盖 · 再次点击取消 &nbsp;|&nbsp; 滚轮缩放 · 拖拽移动</div>

<button class="lb-fab" id="lb-fab" onclick="toggleLbPanel()">⚔ 排行榜</button>
<div id="toast"></div>
<div id="combo-toast"></div>

<script>
const SUPABASE_URL = 'https://qxtgqozhxhywfrcoztpc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4dGdxb3poeGh5d2ZyY296dHBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MjkxNDcsImV4cCI6MjA5NDIwNTE0N30.kX8hYquYYEt9CSqv592qaV-Urf0th4CjXOgZ_Or11Lw';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const TEAM        = ['Mico Mi', 'Gary Huang', 'Aimee Qu', 'Lucas Luo', 'Will Ouyang', 'John Fan', 'Jason Liu', 'TBD'];
const MEDALS      = ['🥇', '🥈', '🥉'];
const STORAGE_KEY = 'sales_map_v1';
const USER_KEY    = 'sales_map_user';
const HUNAN_CODE  = '430000';
const HUBEI_CODE  = '420000';

const VISITOR_KEY   = '__visitor__';
let savedUser       = localStorage.getItem(USER_KEY) || '';
let isVisitor       = savedUser === VISITOR_KEY;
let currentUser     = isVisitor ? '' : savedUser;
let coveredSet      = new Set();
let adcodeToLitBy   = {};
let leaderboardData = {};
let prevRankOrder   = [];
let allFeatures     = [];
let nameToAdcode    = {};
let adcodeToName    = {};
let chart;
let toastTimer;
let comboTimer      = {};
let applyingRemote  = false;
const pendingInserts = new Set();

// ---------- 排行榜初始化 ----------
function initLeaderboard() {
    leaderboardData = {};
    TEAM.forEach(n => { leaderboardData[n] = 0; });
}

// ---------- localStorage 备份 ----------
function saveLocal() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...coveredSet]));
}

// ---------- Supabase: 初始加载 ----------
async function loadCovered() {
    try {
        const { data, error } = await db.from('covered_counties').select('adcode, lit_by');
        if (error) throw error;
        const set = new Set();
        initLeaderboard();
        data.forEach(r => {
            set.add(r.adcode);
            adcodeToLitBy[r.adcode] = r.lit_by;
            if (r.lit_by && leaderboardData[r.lit_by] !== undefined) {
                leaderboardData[r.lit_by]++;
            }
        });
        return set;
    } catch (e) {
        console.warn('Supabase加载失败，使用本地缓存:', e);
        initLeaderboard();
        return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
    }
}

// ---------- Supabase: 写入变更 ----------
async function syncToSupabase(added, removed) {
    try {
        const ops = [];
        if (added.length) {
            added.forEach(a => {
                pendingInserts.add(a);
                setTimeout(() => pendingInserts.delete(a), 10000);
            });
            ops.push(db.from('covered_counties').upsert(
                added.map(adcode => ({ adcode, lit_by: currentUser }))
            ));
        }
        if (removed.length) {
            ops.push(db.from('covered_counties').delete().in('adcode', removed));
        }
        await Promise.all(ops);
    } catch (e) {
        console.error('Supabase同步失败:', e);
    }
}

// ---------- Supabase: 实时订阅 ----------
function setupRealtime() {
    db.channel('map_sync')
        .on('postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'covered_counties' },
            payload => {
                const adcode = payload.new?.adcode;
                const litBy  = payload.new?.lit_by;
                if (!adcode || coveredSet.has(adcode) || pendingInserts.has(adcode)) return;

                adcodeToLitBy[adcode] = litBy;
                if (litBy && leaderboardData[litBy] !== undefined) leaderboardData[litBy]++;

                const name = adcodeToName[adcode];
                applyingRemote = true;
                coveredSet.add(adcode);
                if (name) chart?.dispatchAction({ type: 'select', seriesIndex: 0, name });
                applyingRemote = false;

                saveLocal();
                updateStats();
                renderLeaderboard();
                if (name && litBy) {
                    showToast(`🔔 ${litBy} 点亮了：${name}`);
                    trackCombo(litBy);
                }
            }
        )
        .on('postgres_changes',
            { event: 'DELETE', schema: 'public', table: 'covered_counties' },
            payload => {
                const adcode = payload.old?.adcode;
                const litBy  = payload.old?.lit_by;
                if (!adcode || !coveredSet.has(adcode)) return;

                if (litBy && leaderboardData[litBy] !== undefined) {
                    leaderboardData[litBy] = Math.max(0, leaderboardData[litBy] - 1);
                }
                delete adcodeToLitBy[adcode];

                const name = adcodeToName[adcode];
                applyingRemote = true;
                coveredSet.delete(adcode);
                if (name) chart?.dispatchAction({ type: 'unselect', seriesIndex: 0, name });
                applyingRemote = false;

                saveLocal();
                updateStats();
                renderLeaderboard();
            }
        )
        .subscribe(status => setSyncStatus(status === 'SUBSCRIBED'));
}

// ---------- 同步状态 ----------
function setSyncStatus(connected) {
    document.getElementById('sync-dot').classList.toggle('connected', connected);
    document.getElementById('sync-label').textContent = connected ? '实时同步' : '离线模式';
}

// ---------- 渲染排行榜（FLIP 动画 + 名次超越检测）----------
function renderLeaderboard() {
    const container = document.getElementById('leaderboard');
    const sorted = Object.entries(leaderboardData).sort((a, b) => b[1] - a[1]);
    const newRankOrder = sorted.map(([name]) => name);

    // 检测名次提升
    const rankUps = new Set();
    newRankOrder.forEach((name, newIdx) => {
        const oldIdx = prevRankOrder.indexOf(name);
        if (oldIdx !== -1 && oldIdx > newIdx) rankUps.add(name);
    });

    // FLIP 第一步：记录旧位置
    const oldPos = {};
    container.querySelectorAll('.lb-item[data-name]').forEach(el => {
        oldPos[el.dataset.name] = el.getBoundingClientRect().top;
    });

    // 更新 DOM
    container.innerHTML = sorted.map(([name, count], i) => {
        const isMe   = name === currentUser;
        const rankUp = rankUps.has(name);
        const rank   = MEDALS[i] ?? `<span style="color:#3a4a6a;font-size:12px">${i + 1}</span>`;
        return `<div class="lb-item${isMe ? ' me' : ''}${rankUp ? ' rank-up' : ''}" data-name="${name}">
            <div class="lb-rank">${rank}</div>
            <div class="lb-name">${name}</div>
            <div class="lb-count">${count}</div>
        </div>`;
    }).join('');

    // FLIP 第三四步：计算位移 → 播放动画
    container.querySelectorAll('.lb-item[data-name]').forEach(el => {
        const name = el.dataset.name;
        if (oldPos[name] === undefined) return;
        const delta = oldPos[name] - el.getBoundingClientRect().top;
        if (Math.abs(delta) < 1) return;
        el.style.transform = `translateY(${delta}px)`;
        el.style.transition = 'none';
        requestAnimationFrame(() => requestAnimationFrame(() => {
            el.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            el.style.transform  = '';
        }));
    });

    prevRankOrder = newRankOrder;
}

// ---------- Toast ----------
function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

let comboToastTimer;
function showComboToast(msg) {
    const el = document.getElementById('combo-toast');
    el.classList.remove('show');
    void el.offsetWidth;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(comboToastTimer);
    comboToastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ---------- 连击追踪 ----------
const comboTracker = {};
const COMBO_MSGS = {
    3: n => `🔥 ${n} 连击 ×3！`,
    5: n => `⚡ ${n} 连击 ×5！势不可挡！`,
    8: n => `🚀 ${n} 连击 ×8！开挂了？！`,
};

function trackCombo(name) {
    if (!comboTracker[name]) comboTracker[name] = 0;
    comboTracker[name]++;
    clearTimeout(comboTimer[name]);
    comboTimer[name] = setTimeout(() => { delete comboTracker[name]; }, 3000);

    const c = comboTracker[name];
    if (COMBO_MSGS[c]) showComboToast(COMBO_MSGS[c](name));
    else if (c > 8 && (c - 8) % 3 === 0) showComboToast(`💥 ${name} 连击 ×${c}！！`);
}

// ---------- 里程碑烟花 ----------
function celebrateMilestone(pct) {
    if (pct === 100) {
        const end = Date.now() + 3500;
        (function burst() {
            confetti({ particleCount: 6, angle: 60,  spread: 55, origin: { x: 0,   y: 0.6 }, colors: ['#4da6ff','#ffd700','#fff'] });
            confetti({ particleCount: 6, angle: 120, spread: 55, origin: { x: 1,   y: 0.6 }, colors: ['#4da6ff','#ff6b6b','#80c8ff'] });
            if (Date.now() < end) requestAnimationFrame(burst);
        })();
    } else if (pct >= 75) {
        confetti({ particleCount: 160, spread: 100, origin: { y: 0.5 }, colors: ['#4da6ff','#ffd700','#ff6b6b','#80c8ff','#fff'] });
    } else if (pct >= 50) {
        confetti({ particleCount: 100, spread: 80,  origin: { y: 0.55 } });
    } else if (pct >= 25) {
        confetti({ particleCount: 60,  spread: 70,  origin: { y: 0.6 } });
    } else {
        confetti({ particleCount: 30,  spread: 60,  origin: { y: 0.65 } });
    }
}

// ---------- 里程碑 ----------
const MILESTONES = [
    { pct: 10,  msg: '🎉 已覆盖 10%，好的开始！' },
    { pct: 25,  msg: '🔥 四分之一版图点亮！' },
    { pct: 50,  msg: '⚡ 半壁江山！继续加油！' },
    { pct: 75,  msg: '🚀 已覆盖 75%，胜利在望！' },
    { pct: 100, msg: '🏆 全域制霸！湘鄂无敌！' },
];
let triggeredMilestones = new Set();

function checkMilestone(pct) {
    for (const m of MILESTONES) {
        if (pct >= m.pct && !triggeredMilestones.has(m.pct)) {
            triggeredMilestones.add(m.pct);
            showToast(m.msg);
            celebrateMilestone(m.pct);
        }
    }
}

// ---------- 数字跳动 ----------
function bumpNumber(id) {
    const el = document.getElementById(id);
    el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 300);
}

// ---------- 更新统计 ----------
function updateStats() {
    const lit   = coveredSet.size;
    const total = allFeatures.length;
    const pct   = total ? Math.round(lit / total * 100) : 0;
    document.getElementById('lit-count').textContent   = lit;
    document.getElementById('total-count').textContent = total || '—';
    document.getElementById('percent').textContent     = pct + '%';
    document.getElementById('progress-fill').style.width = pct + '%';
    checkMilestone(pct);
}

// ---------- 构造地图数据 ----------
function buildMapData() {
    return allFeatures.map(f => {
        const adcode  = String(f.properties.adcode);
        const covered = coveredSet.has(adcode);
        return { name: f.properties.name, adcode, value: covered ? 1 : 0, selected: covered };
    });
}

// ---------- 初始化地图 ----------
function initChart(geoJson, cityFeats) {
    document.getElementById('loading').style.display = 'none';
    echarts.registerMap('HunanHubei', geoJson);

    allFeatures = geoJson.features;
    allFeatures.forEach(f => {
        const adcode = String(f.properties.adcode);
        nameToAdcode[f.properties.name] = adcode;
        adcodeToName[adcode] = f.properties.name;
    });

    const cityBorderLines = [];
    cityFeats.forEach(f => {
        const polys = f.geometry.type === 'MultiPolygon'
            ? f.geometry.coordinates : [f.geometry.coordinates];
        polys.forEach(poly => poly.forEach(ring => {
            cityBorderLines.push({ coords: [...ring, ring[0]] });
        }));
    });

    chart = echarts.init(document.getElementById('map'));
    chart.setOption({
        backgroundColor: '#060c1a',
        geo: [{
            map: 'HunanHubei',
            roam: true,
            scaleLimit: { min: 1, max: 20 },
            itemStyle: { areaColor: '#0d1b36', borderColor: '#1e3060', borderWidth: 0.6 },
            emphasis: { disabled: true },
            label: { show: false }
        }],
        tooltip: {
            trigger: 'item',
            backgroundColor: 'rgba(6,12,26,0.92)',
            borderColor: 'rgba(77,166,255,0.25)',
            textStyle: { color: '#c8d8ff', fontSize: 13 },
            formatter: params => {
                if (!params.name) return '';
                const adcode = nameToAdcode[params.name];
                if (!adcode) return '';
                const covered = coveredSet.has(adcode);
                const litBy   = adcodeToLitBy[adcode];
                return `<b style="color:#fff">${params.name}</b><br/>
                    ${covered
                        ? `<span style="color:#4da6ff">✅ ${litBy ? litBy + ' 覆盖' : '已覆盖'}</span>`
                        : '<span style="color:#5a6a8a">未覆盖，点击标记</span>'}`;
            }
        },
        series: [
            {
                name: 'county',
                type: 'map',
                geoIndex: 0,
                data: buildMapData(),
                selectedMode: 'multiple',
                select: {
                    itemStyle: {
                        areaColor: '#1a6fff',
                        borderColor: '#4da6ff',
                        shadowBlur: 18,
                        shadowColor: 'rgba(77,166,255,0.8)'
                    },
                    label: { show: false }
                },
                emphasis: {
                    itemStyle: { areaColor: '#2a5fff' },
                    label: { show: true, color: '#fff', fontSize: 10 }
                },
                label: { show: false }
            },
            {
                type: 'lines',
                coordinateSystem: 'geo',
                geoIndex: 0,
                polyline: true,
                silent: true,
                z: 10,
                data: cityBorderLines,
                lineStyle: { color: 'rgba(120,185,255,0.85)', width: 2.5, opacity: 1 }
            }
        ]
    });

    updateStats();
    renderLeaderboard();

    chart.on('selectchanged', params => {
        if (applyingRemote) {
            updateStats();
            return;
        }

        const selectedIndices = params.selected?.[0]?.dataIndex ?? [];
        const prevSet = new Set(coveredSet);

        coveredSet = new Set(
            selectedIndices
                .map(i => allFeatures[i] ? String(allFeatures[i].properties.adcode) : null)
                .filter(Boolean)
        );

        const added   = [...coveredSet].filter(a => !prevSet.has(a));
        const removed = [...prevSet].filter(a => !coveredSet.has(a));

        added.forEach(adcode => {
            adcodeToLitBy[adcode] = currentUser;
            if (leaderboardData[currentUser] !== undefined) leaderboardData[currentUser]++;
        });
        removed.forEach(adcode => {
            const prev = adcodeToLitBy[adcode];
            if (prev && leaderboardData[prev] !== undefined) {
                leaderboardData[prev] = Math.max(0, leaderboardData[prev] - 1);
            }
            delete adcodeToLitBy[adcode];
        });

        const rawName = params.fromActionPayload?.name;
        const name = Array.isArray(rawName) ? rawName[0] : rawName;
        if (name) {
            if (coveredSet.size > prevSet.size) {
                showToast(`✅ 已点亮：${name}`);
                bumpNumber('lit-count');
            } else {
                showToast(`取消覆盖：${name}`);
            }
        }

        saveLocal();
        syncToSupabase(added, removed);
        updateStats();
        renderLeaderboard();
    });

    // 恢复已点亮县的视觉高亮（ECharts 不会从 data.selected 自动重绘）
    const initPct = allFeatures.length ? Math.round(coveredSet.size / allFeatures.length * 100) : 0;
    MILESTONES.forEach(m => { if (initPct >= m.pct) triggeredMilestones.add(m.pct); });
    applyingRemote = true;
    coveredSet.forEach(adcode => {
        const name = adcodeToName[adcode];
        if (name) chart.dispatchAction({ type: 'select', seriesIndex: 0, name });
    });
    applyingRemote = false;
}

// ---------- 姓名选择 ----------
function initNameModal() {
    document.getElementById('name-grid').innerHTML = TEAM.map(name =>
        `<button class="name-btn" onclick="selectUser('${name}')">${name}</button>`
    ).join('');
}

function selectUser(name) {
    isVisitor   = name === VISITOR_KEY;
    currentUser = isVisitor ? '' : name;
    localStorage.setItem(USER_KEY, name);
    document.getElementById('name-modal').classList.add('hidden');
    document.getElementById('user-badge').textContent = isVisitor ? '👁 参观' : name;
    document.getElementById('map-overlay').classList.toggle('active', isVisitor);
    renderLeaderboard();
}

function switchUser() {
    document.getElementById('name-modal').classList.remove('hidden');
}

function toggleLbPanel() {
    const panel = document.querySelector('.leaderboard-panel');
    const close = document.getElementById('lb-close');
    const isOpen = panel.classList.toggle('open');
    close.style.display = isOpen ? 'block' : 'none';
}

// ---------- 加载地图数据 ----------
async function loadMap() {
    const loadingEl = document.querySelector('.loading-text');
    try {
        const coveredPromise = loadCovered();
        const geoOpts = { referrerPolicy: 'no-referrer' };

        loadingEl.textContent = '加载省市数据';
        const [hunan, hubei] = await Promise.all([
            fetch(`https://geo.datav.aliyun.com/areas_v3/bound/${HUNAN_CODE}_full.json`, geoOpts).then(r => r.json()),
            fetch(`https://geo.datav.aliyun.com/areas_v3/bound/${HUBEI_CODE}_full.json`, geoOpts).then(r => r.json())
        ]);

        const cityFeatures = [...hunan.features, ...hubei.features]
            .filter(f => f.properties.level === 'city');
        const cityAdcodes = cityFeatures.map(f => f.properties.adcode);

        loadingEl.textContent = `加载县级数据（共 ${cityAdcodes.length} 个地市）`;

        const cityResults = await Promise.all(
            cityAdcodes.map(code =>
                fetch(`https://geo.datav.aliyun.com/areas_v3/bound/${code}_full.json`, geoOpts)
                    .then(r => r.json())
                    .catch(() => ({ features: [] }))
            )
        );

        const cityFeatureByAdcode = {};
        [...hunan.features, ...hubei.features].forEach(f => {
            cityFeatureByAdcode[f.properties.adcode] = f;
        });

        const features = [];
        cityAdcodes.forEach((adcode, i) => {
            const sub = cityResults[i].features.filter(
                f => !['province', 'city'].includes(f.properties.level)
            );
            if (sub.length > 0) features.push(...sub);
            else if (cityFeatureByAdcode[adcode]) features.push(cityFeatureByAdcode[adcode]);
        });

        if (features.length === 0) throw new Error('未获取到地图数据');

        coveredSet = await coveredPromise;
        initChart({ type: 'FeatureCollection', features }, cityFeatures);
        setupRealtime();

    } catch (e) {
        loadingEl.textContent = '地图加载失败，请确认网络正常后刷新页面';
        loadingEl.classList.remove('loading-dots');
        loadingEl.style.color = '#ff6060';
        console.error('地图加载失败:', e);
    }
}

// ---------- 启动 ----------
initLeaderboard();
initNameModal();

if (savedUser) {
    document.getElementById('name-modal').classList.add('hidden');
    document.getElementById('user-badge').textContent = isVisitor ? '👁 参观' : currentUser;
    if (isVisitor) document.getElementById('map-overlay').classList.add('active');
}

window.addEventListener('resize', () => chart?.resize());

// 参观者模式：遮罩层拦截点击，但滚轮缩放事件转发给 ECharts
document.getElementById('map-overlay').addEventListener('wheel', (e) => {
    document.getElementById('map').dispatchEvent(new WheelEvent('wheel', {
        bubbles: true,
        deltaX: e.deltaX, deltaY: e.deltaY, deltaZ: e.deltaZ, deltaMode: e.deltaMode,
        clientX: e.clientX, clientY: e.clientY,
        ctrlKey: e.ctrlKey, shiftKey: e.shiftKey, altKey: e.altKey, metaKey: e.metaKey,
    }));
}, { passive: true });

loadMap();
</script>
