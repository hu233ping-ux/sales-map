<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>湘鄂销售覆盖版图</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #060c1a;
            color: #c8d8ff;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(77,166,255,0.12);
            flex-shrink: 0;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            color: #4da6ff;
            letter-spacing: 3px;
        }

        .stats {
            display: flex;
            gap: 36px;
            align-items: center;
        }

        .stat { text-align: center; }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #4da6ff;
            line-height: 1;
            transition: all 0.3s;
        }

        .stat-number.bump {
            color: #80c8ff;
            transform: scale(1.15);
        }

        .stat-label {
            font-size: 11px;
            color: #5a6a8a;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .progress-bar-wrap {
            width: 160px;
        }

        .progress-bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #5a6a8a;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .progress-bar-bg {
            height: 6px;
            background: #0f1d3a;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #1a5fff, #4da6ff);
            border-radius: 3px;
            transition: width 0.4s ease;
            box-shadow: 0 0 8px rgba(77,166,255,0.6);
        }

        .sync-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #5a6a8a;
            letter-spacing: 1px;
        }

        .sync-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #5a6a8a;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .sync-dot.connected {
            background: #00c97d;
            box-shadow: 0 0 6px rgba(0,201,125,0.7);
        }

        #map-container {
            flex: 1;
            position: relative;
            min-height: 0;
            overflow: hidden;
        }

        #map {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
        }

        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #060c1a;
            gap: 12px;
            z-index: 10;
        }

        .loading-text {
            font-size: 14px;
            color: #4da6ff;
            letter-spacing: 2px;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.2s steps(3, end) infinite;
        }

        @keyframes dots {
            0%   { content: ''; }
            33%  { content: '.'; }
            66%  { content: '..'; }
            100% { content: '...'; }
        }

        .footer {
            padding: 7px;
            text-align: center;
            font-size: 12px;
            color: #2a3a5a;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        #toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(26,111,255,0.9);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            letter-spacing: 1px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 100;
            white-space: nowrap;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

<header>
    <div class="title">湘鄂销售覆盖版图</div>
    <div class="stats">
        <div class="stat">
            <div class="stat-number" id="lit-count">0</div>
            <div class="stat-label">已点亮</div>
        </div>
        <div class="stat">
            <div class="stat-number" id="total-count">—</div>
            <div class="stat-label">总县区</div>
        </div>
        <div class="progress-bar-wrap">
            <div class="progress-bar-label">
                <span>覆盖进度</span>
                <span id="percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
            </div>
        </div>
        <div class="sync-status">
            <div class="sync-dot" id="sync-dot"></div>
            <span id="sync-label">连接中</span>
        </div>
    </div>
</header>

<div id="map-container">
    <div id="loading">
        <div class="loading-text loading-dots">地图加载中</div>
    </div>
    <div id="map"></div>
</div>

<div class="footer">点击县区 · 点亮覆盖 · 再次点击取消 &nbsp;|&nbsp; 滚轮缩放 · 拖拽移动</div>

<div id="toast"></div>

<script>
const SUPABASE_URL = 'https://qxtgqozhxhywfrcoztpc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4dGdxb3poeGh5d2ZyY296dHBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MjkxNDcsImV4cCI6MjA5NDIwNTE0N30.kX8hYquYYEt9CSqv592qaV-Urf0th4CjXOgZ_Or11Lw';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const STORAGE_KEY = 'sales_map_v1';
const HUNAN_CODE  = '430000';
const HUBEI_CODE  = '420000';

let coveredSet     = new Set();
let allFeatures    = [];
let nameToAdcode   = {};
let adcodeToName   = {};
let chart;
let toastTimer;
let applyingRemote = false;

// ---------- localStorage 备份 ----------
function saveLocal() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...coveredSet]));
}

// ---------- Supabase: 初始加载 ----------
async function loadCovered() {
    try {
        const { data, error } = await db.from('covered_counties').select('adcode');
        if (error) throw error;
        return new Set(data.map(r => r.adcode));
    } catch (e) {
        console.warn('Supabase加载失败，使用本地缓存:', e);
        return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
    }
}

// ---------- Supabase: 写入变更 ----------
async function syncToSupabase(added, removed) {
    try {
        const ops = [];
        if (added.length) {
            ops.push(db.from('covered_counties').upsert(added.map(adcode => ({ adcode }))));
        }
        if (removed.length) {
            ops.push(db.from('covered_counties').delete().in('adcode', removed));
        }
        await Promise.all(ops);
    } catch (e) {
        console.error('Supabase同步失败:', e);
    }
}

// ---------- Supabase: 实时订阅 ----------
function setupRealtime() {
    db.channel('map_sync')
        .on('postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'covered_counties' },
            payload => {
                const adcode = payload.new?.adcode;
                if (!adcode || coveredSet.has(adcode)) return;
                const name = adcodeToName[adcode];
                applyingRemote = true;
                coveredSet.add(adcode);
                if (name) chart?.dispatchAction({ type: 'select', seriesIndex: 0, name });
                applyingRemote = false;
                saveLocal();
                updateStats();
                if (name) showToast(`🔔 队友点亮了：${name}`);
            }
        )
        .on('postgres_changes',
            { event: 'DELETE', schema: 'public', table: 'covered_counties' },
            payload => {
                const adcode = payload.old?.adcode;
                if (!adcode || !coveredSet.has(adcode)) return;
                const name = adcodeToName[adcode];
                applyingRemote = true;
                coveredSet.delete(adcode);
                if (name) chart?.dispatchAction({ type: 'unselect', seriesIndex: 0, name });
                applyingRemote = false;
                saveLocal();
                updateStats();
            }
        )
        .subscribe(status => {
            setSyncStatus(status === 'SUBSCRIBED');
        });
}

// ---------- 同步状态指示 ----------
function setSyncStatus(connected) {
    document.getElementById('sync-dot').classList.toggle('connected', connected);
    document.getElementById('sync-label').textContent = connected ? '实时同步' : '离线模式';
}

// ---------- Toast 提示 ----------
function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ---------- 里程碑庆祝 ----------
const MILESTONES = [
    { pct: 10,  msg: '🎉 已覆盖 10%，好的开始！' },
    { pct: 25,  msg: '🔥 四分之一版图点亮！' },
    { pct: 50,  msg: '⚡ 半壁江山！继续加油！' },
    { pct: 75,  msg: '🚀 已覆盖 75%，胜利在望！' },
    { pct: 100, msg: '🏆 全域制霸！湘鄂无敌！' },
];
let triggeredMilestones = new Set();

function checkMilestone(pct) {
    for (const m of MILESTONES) {
        if (pct >= m.pct && !triggeredMilestones.has(m.pct)) {
            triggeredMilestones.add(m.pct);
            showToast(m.msg);
        }
    }
}

// ---------- 数字跳动动画 ----------
function bumpNumber(id) {
    const el = document.getElementById(id);
    el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 300);
}

// ---------- 更新统计 ----------
function updateStats() {
    const lit   = coveredSet.size;
    const total = allFeatures.length;
    const pct   = total ? Math.round(lit / total * 100) : 0;

    document.getElementById('lit-count').textContent   = lit;
    document.getElementById('total-count').textContent = total || '—';
    document.getElementById('percent').textContent     = pct + '%';
    document.getElementById('progress-fill').style.width = pct + '%';

    checkMilestone(pct);
}

// ---------- 构造地图数据 ----------
function buildMapData() {
    return allFeatures.map(f => {
        const adcode  = String(f.properties.adcode);
        const covered = coveredSet.has(adcode);
        return { name: f.properties.name, adcode, value: covered ? 1 : 0, selected: covered };
    });
}

// ---------- 初始化地图 ----------
function initChart(geoJson, cityFeats) {
    document.getElementById('loading').style.display = 'none';

    echarts.registerMap('HunanHubei', geoJson);

    allFeatures = geoJson.features;
    allFeatures.forEach(f => {
        const adcode = String(f.properties.adcode);
        nameToAdcode[f.properties.name] = adcode;
        adcodeToName[adcode] = f.properties.name;
    });

    const cityBorderLines = [];
    cityFeats.forEach(f => {
        const polys = f.geometry.type === 'MultiPolygon'
            ? f.geometry.coordinates
            : [f.geometry.coordinates];
        polys.forEach(poly => {
            poly.forEach(ring => {
                cityBorderLines.push({ coords: [...ring, ring[0]] });
            });
        });
    });

    chart = echarts.init(document.getElementById('map'));

    chart.setOption({
        backgroundColor: '#060c1a',
        geo: [{
            map: 'HunanHubei',
            roam: true,
            scaleLimit: { min: 1, max: 20 },
            itemStyle: {
                areaColor: '#0d1b36',
                borderColor: '#1e3060',
                borderWidth: 0.6
            },
            emphasis: { disabled: true },
            label: { show: false }
        }],
        tooltip: {
            trigger: 'item',
            backgroundColor: 'rgba(6,12,26,0.92)',
            borderColor: 'rgba(77,166,255,0.25)',
            textStyle: { color: '#c8d8ff', fontSize: 13 },
            formatter: params => {
                if (!params.name) return '';
                const adcode = nameToAdcode[params.name];
                if (!adcode) return '';
                const covered = coveredSet.has(adcode);
                return `<b style="color:#fff">${params.name}</b><br/>
                        ${covered
                            ? '<span style="color:#4da6ff">✅ 已覆盖</span>'
                            : '<span style="color:#5a6a8a">未覆盖，点击标记</span>'}`;
            }
        },
        series: [
            {
                name: 'county',
                type: 'map',
                geoIndex: 0,
                data: buildMapData(),
                selectedMode: 'multiple',
                select: {
                    itemStyle: {
                        areaColor: '#1a6fff',
                        borderColor: '#4da6ff',
                        shadowBlur: 18,
                        shadowColor: 'rgba(77,166,255,0.8)'
                    },
                    label: { show: false }
                },
                emphasis: {
                    itemStyle: { areaColor: '#2a5fff' },
                    label: { show: true, color: '#fff', fontSize: 10 }
                },
                label: { show: false }
            },
            {
                type: 'lines',
                coordinateSystem: 'geo',
                geoIndex: 0,
                polyline: true,
                silent: true,
                z: 10,
                data: cityBorderLines,
                lineStyle: {
                    color: 'rgba(120,185,255,0.85)',
                    width: 2.5,
                    opacity: 1
                }
            }
        ]
    });

    updateStats();

    chart.on('selectchanged', params => {
        const selectedIndices = params.selected?.[0]?.dataIndex ?? [];
        const prevSet = new Set(coveredSet);

        coveredSet = new Set(
            selectedIndices
                .map(i => allFeatures[i] ? String(allFeatures[i].properties.adcode) : null)
                .filter(Boolean)
        );

        if (applyingRemote) {
            updateStats();
            return;
        }

        const rawName = params.fromActionPayload?.name;
        const name = Array.isArray(rawName) ? rawName[0] : rawName;
        if (name) {
            if (coveredSet.size > prevSet.size) {
                showToast(`✅ 已点亮：${name}`);
                bumpNumber('lit-count');
            } else {
                showToast(`取消覆盖：${name}`);
            }
        }

        const added   = [...coveredSet].filter(a => !prevSet.has(a));
        const removed = [...prevSet].filter(a => !coveredSet.has(a));

        saveLocal();
        syncToSupabase(added, removed);
        updateStats();
    });
}

// ---------- 加载地图数据 ----------
async function loadMap() {
    const loadingEl = document.querySelector('.loading-text');

    try {
        // 并行启动：Supabase数据 + 地理数据
        const coveredPromise = loadCovered();

        loadingEl.textContent = '加载省市数据';
        const [hunan, hubei] = await Promise.all([
            fetch(`https://geo.datav.aliyun.com/areas_v3/bound/${HUNAN_CODE}_full.json`).then(r => r.json()),
            fetch(`https://geo.datav.aliyun.com/areas_v3/bound/${HUBEI_CODE}_full.json`).then(r => r.json())
        ]);

        const cityFeatures = [...hunan.features, ...hubei.features]
            .filter(f => f.properties.level === 'city');
        const cityAdcodes = cityFeatures.map(f => f.properties.adcode);

        loadingEl.textContent = `加载县级数据（共 ${cityAdcodes.length} 个地市）`;

        const cityResults = await Promise.all(
            cityAdcodes.map(code =>
                fetch(`https://geo.datav.aliyun.com/areas_v3/bound/${code}_full.json`)
                    .then(r => r.json())
                    .catch(() => ({ features: [] }))
            )
        );

        const cityFeatureByAdcode = {};
        [...hunan.features, ...hubei.features].forEach(f => {
            cityFeatureByAdcode[f.properties.adcode] = f;
        });

        const features = [];
        cityAdcodes.forEach((adcode, i) => {
            const sub = cityResults[i].features.filter(
                f => !['province', 'city'].includes(f.properties.level)
            );
            if (sub.length > 0) {
                features.push(...sub);
            } else {
                if (cityFeatureByAdcode[adcode]) {
                    features.push(cityFeatureByAdcode[adcode]);
                }
            }
        });

        if (features.length === 0) throw new Error('未获取到地图数据');

        // 等待Supabase数据（通常地理数据更慢，此时已返回）
        coveredSet = await coveredPromise;

        initChart({ type: 'FeatureCollection', features }, cityFeatures);
        setupRealtime();

    } catch (e) {
        loadingEl.textContent = '地图加载失败，请确认网络正常后刷新页面';
        loadingEl.classList.remove('loading-dots');
        loadingEl.style.color = '#ff6060';
        console.error('地图加载失败:', e);
    }
}

window.addEventListener('resize', () => chart?.resize());
loadMap();
</script>
</body>
</html>
